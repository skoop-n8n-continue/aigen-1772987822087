<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sync Clock</title>
    <style>
        :root {
            --primary: #00b7af;
            --dark: #10181f;
            --light: #ffffff;
            --secondary: #6a7071;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .clock-display {
            font-size: 15vw;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(0, 183, 175, 0.3);
            line-height: 1;
        }

        .date-display {
            font-size: 4vw;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 0.2rem;
        }

        .status-bar {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            color: var(--secondary);
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff4d4d;
        }

        .status-indicator.online {
            background-color: #4df34d;
            box-shadow: 0 0 10px #4df34d;
        }

        .sync-info {
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="date" class="date-display">-- --- ----</div>
        <div id="clock" class="clock-display">00:00:00</div>
    </div>

    <div class="status-bar">
        <div id="status-dot" class="status-indicator"></div>
        <span id="status-text">Connecting...</span>
        <span class="sync-info" id="sync-info"></span>
    </div>

    <script src="script.js?v=cl0ck2026"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
